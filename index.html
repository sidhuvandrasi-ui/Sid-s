<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050711;
    --blue: #2678ff;
    --cyan: #66e5ff;
    --white: #f5f8ff;
    --muted: #9ba9c4;
}

html {
    min-height: 100%;
    background: var(--bg);
}

body {
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    background:
        radial-gradient(ellipse at 50% 15%,
        rgba(24, 83, 190, .19), transparent 48%),
        radial-gradient(ellipse at 50% 100%,
        rgba(0, 120, 255, .09), transparent 45%),
        var(--bg);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 22px 18px;
    position: relative;
}

/* BACKGROUND GRID */

.grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .14;
    background-image:
        linear-gradient(rgba(79, 137, 255, .16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 137, 255, .16) 1px, transparent 1px);
    background-size: 38px 38px;
    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 20%,
        black 80%,
        transparent
    );
}

/* AMBIENT LIGHT */

.ambient {
    position: fixed;
    width: 300px;
    height: 300px;
    left: 50%;
    top: 44%;
    transform: translate(-50%, -50%);
    background: rgba(0, 92, 255, .13);
    filter: blur(100px);
    border-radius: 50%;
    pointer-events: none;
}

/* MAIN CARD */

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 410px;
    text-align: center;
    padding: 28px 22px 23px;
    border: 1px solid rgba(111, 157, 255, .20);
    border-radius: 27px;
    background: linear-gradient(
        145deg,
        rgba(19, 29, 54, .82),
        rgba(7, 10, 22, .94) 55%,
        rgba(9, 19, 40, .90)
    );
    box-shadow:
        0 25px 80px rgba(0, 0, 0, .42),
        0 0 45px rgba(27, 103, 255, .08),
        inset 0 1px 0 rgba(255, 255, 255, .07);
    animation: enter .8s ease both;
}

/* TOP BADGE */

.top-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 13px;
    margin-bottom: 24px;
    border: 1px solid rgba(85, 153, 255, .29);
    border-radius: 40px;
    background: rgba(35, 85, 165, .13);
    color: #b9d8ff;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.8px;
}

.live-dot {
    width: 6px;
    height: 6px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #55ffc0;
    box-shadow: 0 0 11px #55ffc0;
    animation: pulse 1.7s infinite;
}

/* LOGO */

.logo-frame {
    position: relative;
    width: 116px;
    height: 116px;
    padding: 3px;
    margin: 0 auto 24px;
    border-radius: 29px;
    background: linear-gradient(
        145deg,
        #9af1ff 0%,
        #398cff 35%,
        #183b9e 70%,
        #72eaff 100%
    );
    box-shadow:
        0 0 25px rgba(47, 128, 255, .32),
        0 0 60px rgba(29, 98, 255, .12);
}

.logo-inner {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 26px;
    background: #080c19;
}

.logo-inner img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* HEADING */

h1 {
    font-size: clamp(27px, 7.7vw, 36px);
    line-height: 1.2;
    font-weight: 900;
    letter-spacing: -1px;
    margin-bottom: 13px;
}

.heading-main {
    display: block;
    color: #ffffff;
}

.heading-accent {
    display: block;
    margin-top: 5px;
    background: linear-gradient(
        90deg,
        #ffffff,
        #8beaff 45%,
        #438dff 90%
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 13px rgba(54, 139, 255, .15));
}

.subtitle {
    max-width: 300px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
    font-weight: 400;
}

/* SEPARATOR */

.divider {
    width: 76%;
    height: 1px;
    margin: 23px auto;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(83, 157, 255, .66),
        transparent
    );
}

/* FEATURE CARDS */

.features {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 22px;
}

.feature {
    min-width: 0;
    padding: 14px 3px 13px;
    border-radius: 13px;
    border: 1px solid rgba(106, 151, 231, .17);
    background: linear-gradient(
        145deg,
        rgba(38, 64, 105, .36),
        rgba(10, 16, 32, .65)
    );
}

.feature-icon {
    display: block;
    margin-bottom: 7px;
    font-size: 17px;
}

.feature strong {
    display: block;
    color: #eaf4ff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .5px;
    margin-bottom: 5px;
}

.feature span {
    display: block;
    color: #7f91b2;
    font-size: 8px;
    letter-spacing: .7px;
    text-transform: uppercase;
}

/* TELEGRAM BUTTON */

.join-btn {
    position: relative;
    isolation: isolate;
    width: 100%;
    min-height: 58px;
    padding: 14px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .32);
    border-radius: 15px;
    background: linear-gradient(
        105deg,
        #1763f6,
        #168cff 53%,
        #37b9ff
    );
    box-shadow:
        0 9px 30px rgba(25, 105, 255, .28),
        inset 0 1px 0 rgba(255, 255, 255, .27);
    color: #ffffff;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
    text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease;
}

.join-btn::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: 0;
    left: -100%;
    width: 70%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .22),
        transparent
    );
    transform: skewX(-20deg);
    animation: shine 4s infinite;
}

.join-btn:active {
    transform: scale(.975);
    box-shadow: 0 5px 17px rgba(25, 105, 255, .3);
}

.telegram-icon {
    width: 23px;
    height: 23px;
    flex-shrink: 0;
    fill: #ffffff;
}

/* FOOTER */

.note {
    margin-top: 15px;
    color: #8495b5;
    font-size: 9px;
    letter-spacing: .7px;
    line-height: 1.7;
}

.footer {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid rgba(115, 151, 215, .12);
    color: #596985;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.7px;
}

/* ANIMATIONS */

@keyframes enter {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
}

@keyframes shine {
    0%, 65% { left: -100%; }
    85%, 100% { left: 150%; }
}

/* SHORT MOBILE SCREENS */

@media (max-height: 740px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 20px 17px 16px;
    }

    .top-label {
        margin-bottom: 15px;
        padding: 7px 11px;
    }

    .logo-frame {
        width: 86px;
        height: 86px;
        border-radius: 23px;
        margin-bottom: 17px;
    }

    .logo-inner {
        border-radius: 20px;
    }

    h1 {
        font-size: 29px;
        margin-bottom: 9px;
    }

    .divider {
        margin: 15px auto;
    }

    .features {
        margin-bottom: 15px;
    }

    .feature {
        padding: 10px 3px;
    }

    .join-btn {
        min-height: 53px;
    }

    .footer {
        margin-top: 14px;
        padding-top: 12px;
    }
}

@media (max-width: 350px) {
    .container {
        padding: 22px 14px 18px;
    }

    .top-label {
        font-size: 8px;
        letter-spacing: 1.2px;
    }

    h1 {
        font-size: 27px;
    }

    .feature strong {
        font-size: 9px;
    }

    .join-btn {
        font-size: 11px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>
